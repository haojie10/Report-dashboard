<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>畅想结算数据分析仪表板 (Excel 支持版)</title>
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-dark: #020617;
            --bg-obsidian: #0f172a;
            --bg-accent: #1e293b;
            --primary: #f97316;
            --primary-glow: rgba(249, 115, 22, 0.4);
            --secondary: #22d3ee;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --border-bright: rgba(255, 255, 255, 0.15);
            --glass-bg: rgba(15, 23, 42, 0.6);
            --glass-blur: blur(12px);
            --radius-sm: 0.5rem;
            --radius-md: 0.75rem;
            --radius-lg: 1.25rem;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -4px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 20px -5px var(--primary-glow);
        }

        body.theme-light {
            --bg-dark: #ffffff;
            --bg-obsidian: #ffffff;
            --bg-accent: #e2e8f0;
            --primary: #d97706;
            --primary-glow: rgba(217, 119, 6, 0.2);
            --secondary: #0891b2;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border: rgba(0, 0, 0, 0.08);
            --border-bright: rgba(0, 0, 0, 0.15);
            --glass-bg: rgba(255, 255, 255, 0.8);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            background: #ffffff !important;
        }

        body.theme-light .bg-slate-900\/40,
        body.theme-light .bg-slate-900\/20,
        body.theme-light .bg-slate-900\/50,
        body.theme-light .bg-slate-950\/40,
        body.theme-light .bg-slate-950 {
            background-color: #ffffff !important;
        }

        body.theme-light .border-slate-800\/80,
        body.theme-light .border-slate-800,
        body.theme-light .border-slate-700,
        body.theme-light .border-slate-800\/50 {
            border-color: #cbd5e1 !important;
        }

        body.theme-light .text-slate-100,
        body.theme-light .text-slate-200,
        body.theme-light .text-slate-300,
        body.theme-light h1,
        body.theme-light h2,
        body.theme-light h3,
        body.theme-light strong {
            color: #0f172a !important;
        }

        body.theme-light .text-slate-400,
        body.theme-light .text-slate-500 {
            color: #475569 !important;
        }

        body.theme-light .bg-slate-800 {
            background-color: #ffffff !important;
            color: #0f172a !important;
            border-color: #cbd5e1 !important;
        }

        body.theme-light .bg-slate-950 {
            background-color: #f8fafc !important;
            border-color: #e2e8f0 !important;
        }

        body.theme-light .tab-switcher button {
            background-color: #e2e8f0 !important;
            color: #475569 !important;
        }

        body.theme-light .tab-switcher button.active {
            background-color: #f97316 !important;
            color: #ffffff !important;
        }

        body.theme-light .content-card,
        body.theme-light .chart-wrapper,
        body.theme-light .insights-panel {
            background-color: #ffffff !important;
            border-color: #cbd5e1 !important;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03) !important;
        }

        body.theme-light td,
        body.theme-light th {
            border-color: #e2e8f0 !important;
            color: #334155 !important;
        }

        body.theme-light th {
            background-color: #f8fafc !important;
            color: #0f172a !important;
        }

        body.theme-light tr:nth-child(even) {
            background-color: #f8fafc !important;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            background: 
                radial-gradient(circle at 0% 0%, rgba(249, 115, 22, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(99, 102, 241, 0.05) 0%, transparent 50%),
                var(--bg-dark);
        }

        .dashboard-container { min-height: 100vh; }

        .dashboard-header {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 2rem;
            position: relative;
        }

        .header-content {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo h1 {
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tab-switcher {
            display: flex;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            gap: 2px;
        }

        .period-selector {
            border: none;
            background: transparent;
            padding: 6px 12px;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            outline: none;
            border-radius: 6px;
        }

        .tab-switcher button {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 500;
            cursor: pointer;
            font-size: 0.875rem;
        }

        .tab-switcher button.active {
            background: var(--bg-accent);
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }

        .upload-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.25rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow-glow);
        }

        .dashboard-main {
            max-width: 1600px;
            margin: 1.5rem auto;
            padding: 0 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .insights-panel {
            background: linear-gradient(to right, rgba(251, 146, 60, 0.1), transparent);
            border: 1px solid rgba(251, 146, 60, 0.2);
            border-left: 4px solid var(--primary);
            padding: 1.25rem 1.75rem;
            border-radius: var(--radius-lg);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.25rem;
        }

        .stat-card {
            background: var(--bg-obsidian);
            border: 1px solid var(--border);
            padding: 1.5rem;
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            gap: 1.25rem;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            border-color: var(--border-bright);
            background: var(--bg-accent);
        }

        .stat-icon {
            background: rgba(249, 115, 22, 0.1);
            color: var(--primary);
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-value {
            font-size: 1.75rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }

        .content-card {
            background: var(--bg-obsidian);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
        }

        .card-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .metric-selector {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.03);
            padding: 3px;
            border-radius: 8px;
        }

        .metric-selector button {
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            border: none;
            background: transparent;
            font-size: 0.75rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        .metric-selector button.active {
            background: var(--bg-accent);
            color: var(--primary);
        }

        .chart-container { padding: 1.5rem; }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 1024px) {
            .dashboard-grid { grid-template-columns: 1fr; }
        }

        /* Initial Upload Screen */
        .upload-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }

        .upload-box {
            max-width: 500px;
            width: 100%;
            padding: 3rem;
            border: 2px dashed var(--border-bright);
            border-radius: var(--radius-lg);
            background: var(--bg-obsidian);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .upload-box:hover {
            border-color: var(--primary);
            background: var(--bg-accent);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- JS Dependencies -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/lodash@4.17.21/lodash.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const Icons = {
            Users: ({ size = 20, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            Layers: ({ size = 20, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>,
            TrendingUp: ({ size = 20, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>,
            DollarSign: ({ size = 20, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>,
            Truck: ({ size = 20, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>,
            BarChart3: ({ size = 20, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>,
            FileSpreadsheet: ({ size = 32, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/><path d="M8 9h2"/><path d="M14 9h2"/></svg>,
            Sparkles: ({ size = 18, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>,
            Percent: ({ size = 20, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>,
            X: ({ size = 20, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            Filter: ({ size = 20, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>,
            ArrowUpDown: ({ size = 16, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/><polyline points="5 12 12 5 19 12"/></svg>,
            Wallet: ({ size = 20, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>,
            FileText: ({ size = 20, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
        };

        const Chart = ({ option, style, onEvents, className }) => {
            const chartRef = React.useRef(null);
            const instanceRef = React.useRef(null);

            React.useEffect(() => {
                if (!instanceRef.current) {
                    instanceRef.current = echarts.init(chartRef.current);
                }
                instanceRef.current.setOption(option);
                
                if (onEvents) {
                    Object.keys(onEvents).forEach(event => {
                        instanceRef.current.off(event);
                        instanceRef.current.on(event, onEvents[event]);
                    });
                }
            }, [option, onEvents]);

            React.useEffect(() => {
                const handleResize = () => instanceRef.current?.resize();
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            return <div ref={chartRef} style={style} className={className} />;
        };

        const round = (n) => Math.round(n * 100) / 100;

        const createBreakdown = (items, dimension) => {
            return Object.entries(_.groupBy(items, dimension)).map(([name, group]) => {
                const c_rev_usd = group.reduce((s, i) => s + i.revenue_usd, 0);
                const c_rev_rmb_net = group.reduce((s, i) => s + i.revenue_rmb, 0);
                const c_rev_rmb_gross = group.reduce((s, i) => s + i.revenue_usd * i.rate, 0);
                const c_gp = group.reduce((s, i) => s + i.gross_profit, 0);
                const c_shipping = group.reduce((s, i) => s + i.shipping_cost, 0);
                return {
                    [dimension]: name,
                    '应收货款_USD': round(c_rev_usd),
                    '毛利': round(c_gp),
                    '毛利率': c_rev_rmb_net === 0 ? 0 : round((c_gp / c_rev_rmb_net) * 100),
                    '出运包干费率': c_rev_rmb_gross === 0 ? 0 : round((c_shipping / c_rev_rmb_gross) * 100)
                };
            });
        };

        const processGroup = (groupData) => {
            const rev_usd = round(groupData.reduce((s, r) => s + r.revenue_usd, 0));
            const rev_usd_net = round(groupData.reduce((s, r) => s + r.revenue_usd_net, 0));
            const rev_rmb_gross = round(groupData.reduce((s, r) => s + r.revenue_usd * r.rate, 0));
            const rev_rmb_net = round(groupData.reduce((s, r) => s + r.revenue_rmb, 0));
            const gp = round(groupData.reduce((s, r) => s + r.gross_profit, 0));
            
            const summary = {
                Revenue_USD: rev_usd,
                Revenue_USD_Net: rev_usd_net,
                Revenue_RMB: rev_rmb_net,
                Original_Revenue_RMB: rev_rmb_gross,
                GrossProfit: gp,
                Costs: {
                    shipping: round(groupData.reduce((s, r) => s + r.shipping_cost, 0)),
                    xinbao: round(groupData.reduce((s, r) => s + r.costs.Xinbao_USD, 0)),
                    bank: round(groupData.reduce((s, r) => s + r.costs.Bank_USD, 0)),
                    comm: round(groupData.reduce((s, r) => s + r.costs.Comm_USD, 0)),
                    tax_refund: round(groupData.reduce((s, r) => s + r.costs['减：退税额'], 0)),
                    purchase: round(groupData.reduce((s, r) => s + r.costs['采购金额（含税销售）'], 0))
                }
            };

            return { 
                groupRows: groupData,
                overall_summary: summary, 
                by_customer: createBreakdown(groupData, 'customer'),
                by_category: createBreakdown(groupData, 'category'),
                by_market: createBreakdown(groupData, 'market')
            };
        };

        const processExcelData = (rows) => {
            const cleanNum = (val) => {
                if (typeof val === 'number') return val;
                if (!val) return 0;
                return Number(String(val).replace(/,/g, '')) || 0;
            };

            const mapKeys = (item) => {
                const keys = Object.keys(item).map(k => k.trim());
                const rawItem = {};
                Object.keys(item).forEach(k => rawItem[k.trim()] = item[k]);

                const find = (keywords) => {
                    // 第一遍：按关键字顺序进行精确匹配 (1st Pass: Exact Match)
                    for (const kw of keywords) {
                        const match = keys.find(k => k.toLowerCase() === kw.toLowerCase());
                        if (match) return match;
                    }
                    // 第二遍：按关键字顺序进行模糊匹配（表头包含关键字，例如：k="2024美元销售额" kw="美元销售额"）
                    for (const kw of keywords) {
                        const match = keys.find(k => k.includes(kw));
                        if (match) return match;
                    }
                    // 第三遍：按关键字顺序进行反向模糊匹配（关键字包含表头，例如：kw="应收货款（美元）" k="应收货款"）
                    // 仅当表头长度 > 1 时触发，防止误中
                    for (const kw of keywords) {
                        const match = keys.find(k => k.length > 1 && kw.includes(k));
                        if (match) return match;
                    }
                    return null;
                };

                const formatPeriod = (val) => {
                    if (!val) return '未知';
                    if (val instanceof Date) {
                        return `${val.getFullYear()}-${String(val.getMonth() + 1).padStart(2, '0')}`;
                    }
                    if (typeof val === 'number') {
                        const date = new Date(Math.round((val - 25569) * 864e5));
                        if (!isNaN(date.getTime()) && date.getFullYear() > 2000) {
                            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
                        }
                    }
                    const s = String(val);
                    if (s.includes('-')) {
                        const parts = s.split('-');
                        if (parts.length >= 2) return `${parts[0]}-${parts[1].padStart(2, '0')}`;
                    }
                    return s;
                };

                const k_period = find(['财务期间', '结算周期', '月份', '期间']);
                const k_customer = find(['客户编号', '客户简称', '客户名称', '客户']);
                const k_category = find(['一级目录', '品类', '分类']);
                const k_market = find(['分公司', '市场分司', '区域', '市场']);
                const k_rate = find(['USD汇率', '汇率']);
                
                const k_rev_usd = find(['销售额（美元）', '美元销售额', '应收货款（美元）', '应收货款_USD']);
                const k_rev_rmb = find(['应收货款', '应收货款_RMB']);
                const k_rev_net = find(['净销售额_RMB', '净销售_RMB']);
                const k_gp = find(['毛利', 'GrossProfit']);

            const k_amount = findKey(['项目金额（万$）', '项目金额', '金额']);
            const k_margin = findKey(['预计毛利率', '毛利率']);
            const k_predict = findKey(['下单预测', '预测']);
            const k_month = findKey(['预计下单月份', '月份', '下单月份']);

            // ffill 状态追踪
            let lastBranch = '未指定';
            let lastCustomerId = '未指定';

            const list = rows.map(r => {
                let branch = r[k_branch] ? String(r[k_branch]).trim() : '';
                let customerId = r[k_customer_id] ? String(r[k_customer_id]).trim() : '';

                // ffill 逻辑
                if (branch) lastBranch = branch;
                else branch = lastBranch;

                if (customerId) lastCustomerId = customerId;
                else customerId = lastCustomerId;

                const rawAmount = cleanNum(r[k_amount]);
                const amountUsd = rawAmount * 10000;

                const marginVal = parsePercent(r[k_margin]);
                const predictVal = r[k_predict] ? String(r[k_predict]).trim() : '不确定下单';
                
                let expectedMonth = '未知月份';
                if (r[k_month]) {

                return {
                    branch,
                    customerId,
                    categoryL3: r[k_category_l3] ? String(r[k_category_l3]).trim() : '其他',
                    amountUsd,
                    margin: marginVal,
                    predict: predictVal,
                    expectedMonth
                };

                list,

                return {

            // --- 新增：外销合同及出运跟踪的计算属性与ECharts配置 ---
            const filteredContracts = useMemo(() => {
                if (!contractData) return [];
                return contractData.list.filter(item => {

            const filteredShipments = useMemo(() => {

                return shipmentData.list.filter(s => allowedContracts.has(s.contractNo));
            }, [shipmentData, filteredContracts, contractData]);

            // 新增：提取所有出运月份并计算月度筛选后的合同数据
            const contractMonths = useMemo(() => {
                if (!shipmentData || !shipmentData.list) return [];
                return [...new Set(shipmentData.list.map(s => s.month))].filter(m => typeof m === 'number' && m > 0).sort((a, b) => a - b);
            }, [shipmentData]);

            const monthlyFilteredContracts = useMemo(() => {
                if (!contractData) return [];
                if (contractMonthFilter === 'all') {
                    return filteredContracts;
                }
                if (!shipmentData || !shipmentData.list) return [];
                
                const targetMonth = Number(contractMonthFilter);
                const matchContract = (s, cNo) => {
                    const sC = s.contractNo;
                    const sO = s.orderNo || '';
                    if (sC === cNo || sO === cNo) return true;
                    if (sC && (sC.startsWith(cNo + '-') || sC.startsWith(cNo + '_'))) return true;
                    if (sO && (sO.startsWith(cNo + '-') || sO.startsWith(cNo + '_'))) return true;
                    if (sC && cNo.startsWith(sC + '-') && (sO === cNo || sO.startsWith(cNo + '-') || sO.startsWith(cNo + '_'))) return true;
                    return false;
                };

                // 按出运月份筛选出运合同，直接保留外销合同表中的F列预算毛利率与I列出运毛利率
                return filteredContracts.filter(item => {
                    return shipmentData.list.some(
                        s => matchContract(s, item.contractNo) && s.month === targetMonth

                });
            }, [filteredContracts, shipmentData, contractMonthFilter]);

            const contractStats = useMemo(() => {
                const total = filteredContracts.reduce((sum, item) => sum + item.totalAmount, 0);

                const actualProfit = filteredContracts.reduce((sum, item) => sum + item.actualProfit, 0);
                const profitDiff = filteredContracts.reduce((sum, item) => sum + item.profitDiff, 0);

                return {
                    total,
                    shipped,
                    unshipped,
                    shipRatio,
                    budgetProfit,
                    actualProfit,
                    profitDiff
                };

            // 新增：客诉模块统计与 ECharts 配置
            const complaintStats = useMemo(() => {

            const complaintReasonOption = useMemo(() => {

                                    if (complaintMetric === 'Loss') {

            const noDataOption = {

            const monthlyShipmentOption = useMemo(() => {

                return {

                    },

                    grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },

            // 新增：毛利率预算 vs 出运毛利率对比 (按客户) ECharts 配置
            const customerMarginComparisonOption = useMemo(() => {
                if (!contractData || monthlyFilteredContracts.length === 0) return noDataOption;
                
                const grouped = _.groupBy(monthlyFilteredContracts, 'customerId');
                const chartData = Object.entries(grouped).map(([customerId, items]) => {

                        borderColor: chartTheme.tooltipBorder,
                        textStyle: { color: chartTheme.tooltipText },
                        formatter: (params) => {
                            const data = params.data;

                    legend: {

                        right: 10,
                        top: 20,
                        bottom: 20,
                        textStyle: { color: chartTheme.textColor }
                    },
                    series: [
                        {
                            name: '品类项目占比',
                            type: 'pie',
                            radius: ['40%', '70%'],
                            center: ['45%', '50%'],
                            avoidLabelOverlap: false,

                                borderWidth: 2

                            label: { show: false, position: 'center' },
                            emphasis: {
                                label: {
                                    show: true,
                                    fontSize: 14,
                                    fontWeight: 'bold',
                                    color: '#f8fafc',
                                    formatter: '{b}\n{d}%'

                            },
                            labelLine: { show: false },
                            data: chartData
                        }

            , [projectData, filteredProjects]);

            // 客户项目：按客户维度的趋势面积图配置
            const projectTrendOption = useMemo(() => {
                if (!projectData || projectData.list.length === 0) return noDataOption;

                const allMonths = projectData.months;
                const scopeList = projectData.list.filter(item => 
                    (projectScope === 'all' || item.predict === '可能下单') &&
                    (projectBranchFilter === 'all' || item.branch === projectBranchFilter)
                );

                const customerTotals = _(scopeList)
                    .groupBy('customerId')
                    .map((items, customerId) => ({
                        customerId,
                        totalScope: _.sumBy(items, 'amountUsd'),
                        totalOverall: _.sumBy(projectData.list.filter(p => p.customerId === customerId), 'amountUsd')
                    }))
                    .orderBy(['totalScope'], ['desc'])
                    .value();

                const top10Customers = customerTotals.slice(0, 10);
                const top10Ids = new Set(top10Customers.map(c => c.customerId));

                const monthlyTotals = {};
                allMonths.forEach(m => {
                    monthlyTotals[m] = _.sumBy(scopeList.filter(i => i.expectedMonth === m), 'amountUsd') || 1;
                });

                const seriesData = top10Customers.map(cust => {
                    const data = allMonths.map(m => {
                        const amount = _.sumBy(scopeList.filter(i => i.customerId === cust.customerId && i.expectedMonth === m), 'amountUsd') || 0;
                        return {
                            value: round(amount),
                            ratioInMonth: amount / monthlyTotals[m],
                            ratioOfOverall: cust.totalOverall > 0 ? (amount / cust.totalOverall) : 0,
                            customerId: cust.customerId
                        };
                    });
                    return {
                        name: cust.customerId,
                        type: 'line',
                        stack: 'project',
                        smooth: true,
                        areaStyle: { opacity: 0.35 },
                        emphasis: {
                            focus: 'series'
                        },
                        symbol: 'circle',
                        symbolSize: 6,
                        itemStyle: {
                            color: projectCustomerColors[cust.customerId]
                        },
                        data: data
                    };
                });

                const otherList = scopeList.filter(i => !top10Ids.has(i.customerId));
                if (otherList.length > 0) {
                    const otherOverallTotal = _.sumBy(projectData.list.filter(p => !top10Ids.has(p.customerId)), 'amountUsd');
                    const data = allMonths.map(m => {
                        const amount = _.sumBy(otherList.filter(i => i.expectedMonth === m), 'amountUsd') || 0;
                        return {
                            value: round(amount),
                            ratioInMonth: amount / monthlyTotals[m],
                            ratioOfOverall: otherOverallTotal > 0 ? (amount / otherOverallTotal) : 0,
                            customerId: '其他客户'
                        };
                    });
                    seriesData.push({
                        name: '其他客户',
                        type: 'line',
                        stack: 'project',
                        smooth: true,
                        areaStyle: { opacity: 0.2 },
                        emphasis: {
                            focus: 'series'
                        },
                        symbol: 'circle',
                        symbolSize: 6,
                        itemStyle: {
                            color: chartTheme.textColor
                        },
                        data: data
                    });
                }

                return {
                    tooltip: {
                        trigger: 'item',
                        backgroundColor: chartTheme.tooltipBg,
                        borderColor: chartTheme.tooltipBorder,
                        textStyle: { color: chartTheme.tooltipText },
                        formatter: (params) => {
                            const customerId = params.seriesName;
                            if (!customerId) return '';

                            // 1. 获取该客户的总项目金额
                            let customerOverall = 0;
                            if (customerId === '其他客户') {
                                customerOverall = _.sumBy(projectData.list.filter(p => !top10Ids.has(p.customerId)), 'amountUsd');
                            } else {
                                customerOverall = _.sumBy(projectData.list.filter(p => p.customerId === customerId), 'amountUsd');
                            }

                            // 2. 统计各月份数据
                            let totalScopeSum = 0;
                            const monthRows = allMonths.map(m => {
                                let amount = 0;
                                if (customerId === '其他客户') {
                                    amount = _.sumBy(scopeList.filter(i => !top10Ids.has(i.customerId) && i.expectedMonth === m), 'amountUsd') || 0;
                                } else {
                                    amount = _.sumBy(scopeList.filter(i => i.customerId === customerId && i.expectedMonth === m), 'amountUsd') || 0;
                                }
                                totalScopeSum += amount;

                                const mTotal = monthlyTotals[m] || 1;
                                const ratioInMonth = amount / mTotal;
                                const ratioOfOverall = customerOverall > 0 ? (amount / customerOverall) : 0;

                                return {
                                    month: m,
                                    value: amount,
                                    ratioInMonth,
                                    ratioOfOverall
                                };
                            });

                            // 3. 构建 Tooltip HTML 内容
                            let res = `<div style="font-weight:bold;margin-bottom:6px;font-size:12px;border-bottom:1px solid rgba(255,255,255,0.15);padding-bottom:4px;display:flex;align-items:center;">
                                <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background-color:${params.color};margin-right:6px;"></span>
                                客户预测趋势: <span style="color:#f472b6;margin-left:4px;">${customerId}</span>
                            </div>`;

                            monthRows.forEach(row => {
                                const hasVal = row.value > 0;
                                const colorStyle = hasVal ? 'color:#fff;font-weight:bold;' : 'color:#64748b;';
                                res += `<div style="margin-bottom:5px;font-size:11px;${colorStyle}">
                                    <div style="display:flex;justify-content:space-between;gap:20px;">
                                        <span>${row.month}</span>
                                        <span>$${row.value.toLocaleString(undefined, {maximumFractionDigits: 0})}</span>
                                    </div>
                                    ${hasVal ? `
                                    <div style="display:flex;justify-content:space-between;color:#94a3b8;font-size:9px;padding-left:8px;margin-top:1px;">
                                        <span>占当月比:</span>
                                        <span>${(row.ratioInMonth * 100).toFixed(1)}%</span>
                                    </div>
                                    <div style="display:flex;justify-content:space-between;color:#94a3b8;font-size:9px;padding-left:8px;">
                                        <span>占自身项目总额比:</span>
                                        <span>${(row.ratioOfOverall * 100).toFixed(1)}%</span>
                                    </div>` : ''}
                                </div>`;
                            });

                            res += `<div style="border-top:1px solid ' + (isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)') + ';margin-top:6px;padding-top:6px;font-size:11px;line-height:1.4;">
                                <div style="display:flex;justify-content:space-between;gap:12px;">
                                    <span style="color:#94a3b8;">预测合计(范围内):</span>
                                    <span style="font-weight:bold;color:#f8fafc;">$${totalScopeSum.toLocaleString(undefined, {maximumFractionDigits: 0})}</span>
                                </div>
                                <div style="display:flex;justify-content:space-between;gap:12px;">
                                    <span style="color:#94a3b8;">客户项目总金额:</span>
                                    <span style="font-weight:bold;color:#f8fafc;">$${customerOverall.toLocaleString(undefined, {maximumFractionDigits: 0})}</span>
                                </div>
                            </div>`;

                            return res;
                        }
                    },
                    legend: {
                        type: 'scroll',
                        textStyle: { color: chartTheme.textColor },
                        top: 0
                    },
                    grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
                    xAxis: {
                        type: 'category',
                        boundaryGap: false,
                        data: allMonths,
                        axisLabel: { color: chartTheme.textColor }
                    },
                    yAxis: {
                        type: 'value',
                        axisLabel: { formatter: (val) => `$${(val/10000).toFixed(0)}万`, color: chartTheme.textColor },
                        splitLine: { lineStyle: { color: chartTheme.splitLine } }
                    },
                    series: seriesData
                };}
            , [projectData, projectScope, projectCustomerColors, projectBranchFilter, chartTheme]);

            const projectTrendEvents = useMemo(() => ({
                mouseover: (params) => {
                    if (params.componentType === 'legend') {
                        const chartDiv = document.querySelector('.project-trend-chart');
                        if (chartDiv) {
                            const chart = echarts.getInstanceByDom(chartDiv);

                                chart.dispatchAction({

                                chart.dispatchAction({

                                    seriesName: params.name

            // 监听 ZRender 的底层 mousemove 事件，使得鼠标处于面积图内部任何位置时均能自动定位并显示 Tooltip 与高亮
            React.useEffect(() => {
                const chartDiv = document.querySelector('.project-trend-chart');
                if (!chartDiv) return;

                const timer = setTimeout(() => {
                    const chart = echarts.getInstanceByDom(chartDiv);
                    if (!chart) return;

                    const zr = chart.getZr();
                    
                    const handleZrMouseMove = (params) => {
                        const x = params.event.offsetX;
                        const y = params.event.offsetY;

                        if (chart.containPixel('grid', [x, y])) {
                            const val = chart.convertFromPixel({ gridIndex: 0 }, [x, y]);
                            const xIndex = Math.round(val[0]);
                            const yVal = val[1];

                            const opt = chart.getOption();
                            const series = opt.series;
                            const monthsCount = opt.xAxis[0].data.length;

                            if (series && xIndex >= 0 && xIndex < monthsCount) {
                                let accum = 0;
                                let hoveredSeriesIndex = -1;

                                for (let i = 0; i < series.length; i++) {
                                    const s = series[i];
                                    const valObj = s.data[xIndex];
                                    const amount = (valObj && typeof valObj === 'object') ? valObj.value : (Number(valObj) || 0);

                                    if (yVal >= accum && yVal <= accum + amount) {
                                        hoveredSeriesIndex = i;
                                        break;
                                    }
                                    accum += amount;
                                }

                                if (hoveredSeriesIndex !== -1) {
                                    chart.dispatchAction({
                                        type: 'highlight',
                                        seriesIndex: hoveredSeriesIndex
                                    });
                                    chart.dispatchAction({
                                        type: 'showTip',
                                        seriesIndex: hoveredSeriesIndex,
                                        dataIndex: xIndex
                                    });
                                } else {
                                    chart.dispatchAction({ type: 'downplay' });
                                    chart.dispatchAction({ type: 'hideTip' });
                                }
                            }
                        }
                    };

                    const handleZrMouseLeave = () => {
                        chart.dispatchAction({ type: 'downplay' });
                        chart.dispatchAction({ type: 'hideTip' });
                    };

                    zr.on('mousemove', handleZrMouseMove);
                    chartDiv.addEventListener('mouseleave', handleZrMouseLeave);

                    chart._cleanupZrEvents = () => {
                        zr.off('mousemove', handleZrMouseMove);
                        chartDiv.removeEventListener('mouseleave', handleZrMouseLeave);
                    };
                }, 300);

                return () => {
                    clearTimeout(timer);
                    const chart = echarts.getInstanceByDom(chartDiv);
                    if (chart && chart._cleanupZrEvents) {
                        chart._cleanupZrEvents();
                    }
                };
            }, [projectData, projectScope, projectMonthFilter, projectBranchFilter]);

            // 表格排序

                if (sortConfig.key !== null) {

                        let aVal = a[sortConfig.key];
                        let bVal = b[sortConfig.key];
                        if (aVal === null || aVal === undefined) return 1;
                        if (bVal === null || bVal === undefined) return -1;
                        if (typeof aVal === 'string') {
                            return sortConfig.direction === 'ascending' 
                                ? aVal.localeCompare(bVal) 
                                : bVal.localeCompare(aVal);
                        } else {
                            return sortConfig.direction === 'ascending' 
                                ? aVal - bVal 
                                : bVal - aVal;
                        }
                    });
                }
                return sortableItems;
            }, [filteredContracts, sortConfig]);

            };

                            onDragOver={handleDrag}

                        >

                            <div className="flex flex-col items-center gap-6 group-hover:scale-110 transition-transform duration-500">
                                <div className={`p-6 rounded-2xl transition-colors ${isDragging ? 'bg-orange-500 text-white' : 'bg-slate-800 group-hover:bg-orange-500/20'}`}>
                                    <Icons.FileSpreadsheet />
                                </div>
                                <div className="space-y-1">
                                    <p className="text-2xl font-bold text-slate-200">{isDragging ? '松开即刻上传解析' : '将 Excel 拖拽至此处'}</p>
                                    <p className="text-slate-500">支持 .xlsx, .xls, .csv 格式</p>
                                </div>
                            </div>
                        </label>
                        <div className="mt-12 flex items-center gap-12 grayscale opacity-40">
                             <span className="text-sm font-bold tracking-tighter">DATA SECURITY FIRST</span>
                             <span className="text-sm font-bold tracking-tighter">OFFLINE ANALYTICS</span>
                             <span className="text-sm font-bold tracking-tighter">EXCEL COMPATIBLE</span>
                        </div>
                    </div>
                );
            }

            const stats = [
                { label: '销售额 (USD)', value: currentSummary.Revenue_USD, unit: '$', icon: <Icons.DollarSign className="text-blue-400" /> },
                { label: '毛利额 (RMB)', value: currentSummary.GrossProfit, unit: '¥', icon: <Icons.TrendingUp className="text-emerald-400" /> },
                { label: '综合毛利率', value: (currentSummary.Original_Revenue_RMB > 0 ? (currentSummary.GrossProfit / currentSummary.Original_Revenue_RMB) * 100 : 0), unit: '%', icon: <Icons.Percent className="text-orange-400" /> },
                { label: '包干费率', value: (currentSummary.Original_Revenue_RMB > 0 ? (currentSummary.Costs.shipping / currentSummary.Original_Revenue_RMB) * 100 : 0), unit: '%', icon: <Icons.Truck className="text-indigo-400" /> }
            ];


            return (
                <div className="dashboard-container">
                    <header className="dashboard-header">
                        <div className="header-content">
                            <div className="logo cursor-pointer" onClick={() => { resetData(); }}>
                                <Icons.Sparkles className="text-orange-500" />
                                <h1>畅想结算分析 <span className="text-sm font-normal text-slate-500 ml-4 italic">{selectedPeriod === 'all' ? '年度数据汇总' : selectedPeriod + ' 结算分析'}</span></h1>
                            </div>
                            
                            <div className="flex items-center gap-6">
                                {selectedItem && (
                                    <div className="flex items-center gap-2 px-3 py-1 bg-orange-500/20 border border-orange-500/30 rounded-full text-orange-400 text-xs transition-all animate-pulse">
                                        <span>下钻: {selectedItem}</span>
                                        <button onClick={() => setSelectedItem(null)}><Icons.X size={14} /></button>
                                    </div>
                                )}
                                <div className="tab-switcher">
                                    <select className="period-selector" value={salesBranchFilter} onChange={(e) => { setSalesBranchFilter(e.target.value); setSelectedItem(null); }}>
                                        <option value="all">所有分公司</option>
                                        {salesBranches.map(b => ( <option key={b} value={b}>{b}</option> ))}
                                    </select>
                                </div>

                                <div className="tab-switcher">
                                    <select className="period-selector" value={selectedPeriod} onChange={(e) => { setSelectedPeriod(e.target.value); setSelectedItem(null); }}>
                                        <option value="all">年度数据汇总</option>
                                        {data.months.map(m => ( <option key={m} value={m}>{m}</option> ))}
                                    </select>

                                <div className="tab-switcher">
                                    <button className={activeTab === 'customer' ? 'active' : ''} onClick={() => { setActiveTab('customer'); setSelectedItem(null); }}>客户维度</button>

                                                    {stat.isPercent ? (stat.value * 100).toFixed(2) : stat.value.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                                                    {stat.unit === '%' ? <span className="text-xs text-slate-500 ml-0.5">{stat.unit}</span> : ''}
                                                </p>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                {/* 第一排图表：占比图饼图 */}
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    {/* 图表E：客户维度的项目占比 */}
                                    <div className="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-5 shadow-lg">
                                        <div className="flex items-center justify-between mb-4">
                                            <h3 className="text-sm font-bold text-slate-200">按客户项目维度金额占比</h3>
                                            <span className="text-[10px] text-slate-500">
                                                {projectScope === 'likely' ? 'USD 预计可下单金额占比' : 'USD 总项目金额占比'}
                                            </span>
                                        </div>
                                        <Chart option={projectCustomerPieOption} style={{ height: '350px' }} />
                                    </div>

                                    {/* 图表F：三级目录维度占比 */}
                                    <div className="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-5 shadow-lg">
                                        <div className="flex items-center justify-between mb-4">
                                            <h3 className="text-sm font-bold text-slate-200">按三级目录维度项目占比 (Top 10)</h3>
                                            <span className="text-[10px] text-slate-500">
                                                {projectScope === 'likely' ? 'USD 预计可下品类占比' : 'USD 全部项目品类占比'}
                                            </span>
                                        </div>
                                        <Chart option={projectCategoryPieOption} style={{ height: '350px' }} />
                                    </div>
                                </div>

                                {/* 第二排图表：趋势面积图 */}
                                <div className="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-5 shadow-lg">
                                    <div className="flex items-center justify-between mb-4">
                                        <h3 className="text-sm font-bold text-slate-200">按客户维度的月度下单预测趋势图</h3>
                                        <span className="text-[10px] text-slate-500">
                                            {projectScope === 'likely' ? '各客户各预计下单月份之可能下单金额折线堆叠图 (万USD)' : '各客户各预计下单月份之总项目金额折线堆叠图 (万USD)'}
                                        </span>
                                    </div>
                                    <Chart option={projectTrendOption} style={{ height: '400px' }} className="project-trend-chart" onEvents={projectTrendEvents} />
                                </div>
                            </div>
                        )}

                        {/* 新增：产品开发目标与进度分析 UI */}
                        {devData && (
                            <div className="mt-8 border-t border-slate-800 pt-8 space-y-6">
                                <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                                    <div className="flex items-center gap-3">
                                        <div className="p-2 bg-blue-500/10 rounded-xl border border-blue-500/20">
                                            <Icons.BarChart3 className="text-blue-500" size={24} />
                                        </div>
                                        <div>
                                            <h2 className="text-2xl font-bold bg-gradient-to-r from-blue-400 to-indigo-200 bg-clip-text text-transparent">产品开发目标与进度分析</h2>
                                            <p className="text-xs text-slate-500 mt-1">按月度展示 MDS 产品录入、展厅实样入库与推广样册输出的目标达成率及数量走势</p>
                                        </div>
                                    </div>
                                    
                                    {/* 筛选器 */}
                                    <div className="flex flex-wrap items-center gap-3 bg-slate-900/50 p-2 rounded-xl border border-slate-800">
                                        <div className="flex items-center gap-1.5 text-xs text-slate-400 px-1">
                                            <Icons.Filter size={14} className="text-blue-500" />
                                            <span>市场分司:</span>
                                        </div>
                                        
                                        <select 
                                            className="bg-slate-800 border border-slate-700 text-xs rounded-lg px-2.5 py-1.5 text-slate-200 outline-none cursor-pointer focus:border-blue-500"
                                            value={devDivisionFilter}
                                            onChange={(e) => setDevDivisionFilter(e.target.value)}
                                        >
                                            <option value="all">所有分司/整体</option>
                                            {devData.divisions.map(d => (
                                                <option key={d} value={d}>{d}</option>
                                            ))}
                                        </select>
                                    </div>
                                </div>

                                {/* KPI 统计卡片 */}
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    {[
                                        { label: 'MDS产品录入 (累计实际)', value: devStats.mdsActual, unit: 'SPU', icon: <Icons.Layers className="text-blue-400" /> },
                                        { label: '展厅实样入库 (累计实际)', value: devStats.showroomActual, unit: 'SKU', icon: <Icons.Sparkles className="text-emerald-400" /> },
                                        { label: '推广样册输出 (累计实际)', value: devStats.promoActual, unit: '份', icon: <Icons.FileSpreadsheet className="text-purple-400" /> }
                                    ].map((stat, i) => (
                                        <div key={i} className="bg-slate-900/40 border border-slate-800/80 p-4 rounded-2xl flex flex-col justify-between hover:bg-slate-900/60 hover:border-slate-700/50 transition-all duration-300">
                                            <div className="flex items-center justify-between mb-2">
                                                <span className="text-[10px] uppercase tracking-wider text-slate-500 font-medium">{stat.label}</span>
                                                <div className="p-1 bg-slate-800/50 rounded-lg">{stat.icon}</div>
                                            </div>
                                            <div>
                                                <p className="text-2xl font-bold font-mono text-slate-100">
                                                    {stat.value.toLocaleString()}
                                                    <span className="text-xs text-slate-500 ml-1">{stat.unit}</span>
                                                </p>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                {/* 图表网格 */}
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    {/* 达成率柱状图 */}
                                    <div className="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-5 shadow-lg">
                                        <div className="flex items-center justify-between mb-4">
                                            <h3 className="text-sm font-bold text-slate-200">每月指标目标达成率对比</h3>
                                            <span className="text-[10px] text-slate-500">实际 / 目标 (%)</span>
                                        </div>
                                        <Chart option={devAchievementOption} style={{ height: '350px' }} />
                                    </div>

                                    {/* 趋势折线图 */}
                                    <div className="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-5 shadow-lg">
                                        <div className="flex items-center justify-between mb-4">
                                            <h3 className="text-sm font-bold text-slate-200">开发指标月度实际走势</h3>
                                            <span className="text-[10px] text-slate-500">双轴显示 (MDS/展厅左轴，样册右轴)</span>
                                        </div>
                                        <Chart option={devTrendOption} style={{ height: '350px' }} />
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 新增：采购合同与结算方式分析 UI */}
                        {purchaseData && (
                            <div className="mt-8 border-t border-slate-800 pt-8 space-y-6">
                                <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                                    <div className="flex items-center gap-3">
                                        <div className="p-2 bg-emerald-500/10 rounded-xl border border-emerald-500/20">
                                            <Icons.Wallet className="text-emerald-500" size={24} />
                                        </div>
                                        <div>
                                            <h2 className="text-2xl font-bold bg-gradient-to-r from-emerald-400 to-teal-200 bg-clip-text text-transparent">采购合同与结算方式分析</h2>
                                            <p className="text-xs text-slate-500 mt-1">从采购合同维度分析结算方式的金额占比及合同数量（计数）占比</p>
                                        </div>
                                    </div>
                                    
                                    {/* 筛选器 */}
                                    <div className="flex flex-wrap items-center gap-3 bg-slate-900/50 p-2 rounded-xl border border-slate-800">
                                        <div className="flex items-center gap-1.5 text-xs text-slate-400 px-1">
                                            <Icons.Filter size={14} className="text-emerald-500" />
                                            <span>月份筛选:</span>
                                        </div>
                                        
                                        <select 
                                            className="bg-slate-800 border border-slate-700 text-xs rounded-lg px-2.5 py-1.5 text-slate-200 outline-none cursor-pointer focus:border-emerald-500"
                                            value={purchaseMonthFilter}
                                            onChange={(e) => setPurchaseMonthFilter(e.target.value)}
                                        >
                                            <option value="all">全部合同月份</option>
                                            {purchaseData.months.map(m => (
                                                <option key={m} value={m}>{m}</option>
                                            ))}
                                        </select>

                                        <div className="w-[1px] h-5 bg-slate-800" />

                                        <div className="flex items-center gap-1.5 text-xs text-slate-400 px-1">
                                            <Icons.Filter size={14} className="text-emerald-500" />
                                            <span>分公司:</span>
                                        </div>
                                        
                                        <select 
                                            className="bg-slate-800 border border-slate-700 text-xs rounded-lg px-2.5 py-1.5 text-slate-200 outline-none cursor-pointer focus:border-emerald-500"
                                            value={purchaseBranchFilter}
                                            onChange={(e) => setPurchaseBranchFilter(e.target.value)}
                                        >
                                            <option value="all">所有分公司</option>
                                            {purchaseBranches.map(b => (
                                                <option key={b} value={b}>{b}</option>
                                            ))}
                                        </select>
                                    </div>
                                </div>

                                {/* KPI 统计卡片 */}
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    {[
                                        { label: '总采购合同金额', value: purchaseStats.totalAmount, unit: '¥', icon: <Icons.DollarSign className="text-blue-400" /> },
                                        { label: '总采购合同数 (计数)', value: purchaseStats.totalCount, unit: '个', icon: <Icons.FileText className="text-emerald-400" />, isCount: true },
                                        { label: '结算方式种类', value: purchaseStats.uniqueSettlements, unit: '种', icon: <Icons.Layers className="text-cyan-400" />, isCount: true }
                                    ].map((stat, i) => (
                                        <div key={i} className="bg-slate-900/40 border border-slate-800/80 p-4 rounded-2xl flex flex-col justify-between hover:bg-slate-900/60 hover:border-slate-700/50 transition-all duration-300">
                                            <div className="flex items-center justify-between mb-2">
                                                <span className="text-[10px] uppercase tracking-wider text-slate-500 font-medium">{stat.label}</span>
                                                <div className="p-1 bg-slate-800/50 rounded-lg">{stat.icon}</div>
                                            </div>
                                            <div>
                                                <p className="text-2xl font-bold font-mono text-slate-100">
                                                    {stat.unit === '¥' || stat.unit === '$' ? <span className="text-xs text-slate-500 mr-0.5">{stat.unit}</span> : ''}
                                                    {stat.isCount ? stat.value : stat.value.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                                                    {stat.unit !== '¥' && stat.unit !== '$' ? <span className="text-xs text-slate-500 ml-0.5">{stat.unit}</span> : ''}
                                                </p>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                {/* 图表：两个占比饼图 */}
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    {/* 采购金额维度占比 */}
                                    <div className="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-5 shadow-lg">
                                        <div className="flex items-center justify-between mb-4">
                                            <h3 className="text-sm font-bold text-slate-200">结算方式占比 (按采购金额)</h3>
                                            <span className="text-[10px] text-slate-500">货值合计 (RMB) 占比</span>
                                        </div>
                                        <Chart option={purchaseAmountPieOption} style={{ height: '350px' }} />
                                    </div>

                                    {/* 采购合同数量维度占比 */}
                                    <div className="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-5 shadow-lg">
                                        <div className="flex items-center justify-between mb-4">
                                            <h3 className="text-sm font-bold text-slate-200">结算方式占比 (按合同数量)</h3>
                                            <span className="text-[10px] text-slate-500">合同计数占比</span>
                                        </div>
                                        <Chart option={purchaseCountPieOption} style={{ height: '350px' }} />
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 新增：售后客诉与损失分析 UI */}
                        {complaintData && (
                            <div className="mt-8 border-t border-slate-800 pt-8 space-y-6">
                                <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                                    <div className="flex items-center gap-3">
                                        <div className="p-2 bg-rose-500/10 rounded-xl border border-rose-500/20">
                                            <Icons.Users className="text-rose-500" size={24} />
                                        </div>
                                        <div>
                                            <h2 className="text-2xl font-bold bg-gradient-to-r from-rose-400 to-red-200 bg-clip-text text-transparent">售后客诉与损失分析</h2>
                                            <p className="text-xs text-slate-500 mt-1">分析客户维度的客诉类型与损失，以及客诉原因维度的客户与损失占比</p>
                                        </div>
                                    </div>
                                    
                                    {/* 切换指标按钮 */}
                                    <div className="flex items-center gap-2 bg-slate-900/50 p-1 rounded-xl border border-slate-800">
                                        <button 
                                            className={`px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${complaintMetric === 'Loss' ? 'bg-rose-500 text-white shadow-lg' : 'text-slate-400 hover:text-slate-200'}`}
                                            onClick={() => setComplaintMetric('Loss')}
                                        >
                                            按损失金额
                                        </button>
                                        <button 
                                            className={`px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${complaintMetric === 'Count' ? 'bg-rose-500 text-white shadow-lg' : 'text-slate-400 hover:text-slate-200'}`}
                                            onClick={() => setComplaintMetric('Count')}
                                        >
                                            按客诉次数
                                        </button>
                                    </div>
                                </div>

                                {/* KPI 卡片 */}
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    {[
                                        { label: '总客诉损失金额', value: complaintStats.totalLoss, unit: '$', icon: <Icons.DollarSign className="text-red-400" /> },
                                        { label: '总投诉次数', value: complaintStats.totalComplaints, unit: '次', icon: <Icons.FileText className="text-rose-400" />, isCount: true },
                                        { label: '波及产品数 (货号数)', value: complaintStats.uniqueProducts, unit: '个', icon: <Icons.Layers className="text-orange-400" />, isCount: true }
                                    ].map((stat, i) => (
                                        <div key={i} className="bg-slate-900/40 border border-slate-800/80 p-4 rounded-2xl flex flex-col justify-between hover:bg-slate-900/60 hover:border-slate-700/50 transition-all duration-300">
                                            <div className="flex items-center justify-between mb-2">
                                                <span className="text-[10px] uppercase tracking-wider text-slate-500 font-medium">{stat.label}</span>
                                                <div className="p-1 bg-slate-800/50 rounded-lg">{stat.icon}</div>
                                            </div>
                                            <div>
                                                <p className="text-2xl font-bold font-mono text-slate-100">
                                                    {stat.unit === '¥' || stat.unit === '$' ? <span className="text-xs text-slate-500 mr-0.5">{stat.unit}</span> : ''}
                                                    {stat.isCount ? stat.value : stat.value.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                                                    {stat.unit !== '¥' && stat.unit !== '$' ? <span className="text-xs text-slate-500 ml-0.5">{stat.unit}</span> : ''}
                                                </p>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                {/* 两个堆叠图表 */}
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    {/* 客户视角堆叠图 */}
                                    <div className="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-5 shadow-lg">
                                        <div className="flex items-center justify-between mb-4">
                                            <h3 className="text-sm font-bold text-slate-200">客户视角：客诉原因分布</h3>
                                            <span className="text-[10px] text-slate-500">{complaintMetric === 'Loss' ? '损失金额 (USD) 堆叠' : '客诉次数堆叠'}</span>
                                        </div>
                                        <Chart option={complaintCustomerOption} style={{ height: '380px' }} />
                                    </div>

                                    {/* 原因视角堆叠图 */}
                                    <div className="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-5 shadow-lg">
                                        <div className="flex items-center justify-between mb-4">
                                            <h3 className="text-sm font-bold text-slate-200">客诉原因视角：涉及客户分布</h3>
                                            <span className="text-[10px] text-slate-500">{complaintMetric === 'Loss' ? '损失金额 (USD) 堆叠' : '客诉次数堆叠'}</span>
                                        </div>
                                        <Chart option={complaintReasonOption} style={{ height: '380px' }} />
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
